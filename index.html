<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>Rye Youth Soccer &mdash; Coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23fff'/%3E%3Cpath d='M16 10l4 3-1.5 4.7h-5L12 13z' fill='%230a1628'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0a1628; --panel:#122238; --panel2:#182c47; --line:#26405f;
  --ink:#eef4fd; --muted:#8fa6c4; --rye:#2563eb; --rye-lt:#60a5fa;
  --grass:#2f9e44; --gold:#ffd166; --warn:#f97316; --bad:#ef4444;
  --pad:max(.9rem,env(safe-area-inset-left));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--navy);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:100svh;padding-bottom:calc(2rem + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:46rem;margin:0 auto;padding:0 var(--pad)}
.hide{display:none!important}

/* ------------------------------------------------------------- top bar */
header{position:sticky;top:0;z-index:30;background:rgba(10,22,40,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:.65rem;padding:.7rem 0 .55rem}
.crest{width:34px;height:40px;flex:none}
.brand .t1{font-size:1.02rem;font-weight:800;letter-spacing:.06em}
.brand .t2{font-size:.68rem;color:var(--muted);letter-spacing:.16em;font-weight:700}
.tabs{display:flex;gap:.4rem;padding-bottom:.55rem}
.tabs button{flex:1;padding:.6rem .4rem;border-radius:11px;background:var(--panel);
  border:1px solid var(--line);font-weight:700;font-size:.95rem;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--rye);border-color:var(--rye-lt);color:#fff}

/* --------------------------------------------------------------- bits */
.sect{padding:1.1rem 0 .3rem}
.sect h2{font-size:1.28rem}
.sect p.lead{color:var(--muted);font-size:.92rem;margin:.35rem 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.72rem 1.05rem;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);font-weight:700;font-size:.95rem}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--rye);border-color:var(--rye-lt);color:#fff}
.btn.go{background:var(--grass);border-color:#4ade80;color:#04220f}
.btn.warn{background:#7c2d12;border-color:var(--warn);color:#ffe8d5}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.42}
.btn.wide{width:100%}
.row{display:flex;gap:.55rem}
.row>*{flex:1}
.pill{display:inline-block;padding:.16rem .55rem;border-radius:999px;
  font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.pill.warm{background:#3b2a0d;color:var(--gold)}
.pill.skill{background:#0d2f45;color:#7dd3fc}
.pill.game{background:#0f3320;color:#86efac}
.note{color:var(--muted);font-size:.85rem}

/* --------------------------------------------------------- warm-up tab */
.plan-bar{margin:.8rem 0 0;padding:.8rem .85rem;border-radius:15px;
  background:linear-gradient(160deg,#16325c,#102340);border:1px solid var(--line)}
.plan-bar .top{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.5rem}
.plan-bar .top b{font-size:1rem}
.plan-bar .total{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800}
.plan-bar .total.over{color:var(--warn)}
.meter{height:7px;border-radius:99px;background:#0a1628;overflow:hidden;margin-bottom:.6rem}
.meter i{display:block;height:100%;background:var(--grass);transition:width .25s}
.meter i.over{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .45rem .3rem .6rem;
  border-radius:99px;background:#0d1e35;border:1px solid var(--line);font-size:.82rem}
.chip b{font-weight:700}
.chip x{display:grid;place-items:center;width:18px;height:18px;border-radius:99px;
  background:#24405f;font-size:.8rem;line-height:1;font-style:normal}
.presets{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.presets button{padding:.35rem .7rem;border-radius:99px;background:#0d1e35;
  border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));
  gap:.75rem;margin:.9rem 0 1.4rem}
.drill{text-align:left;overflow:hidden;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:15px}
.drill.on{border-color:var(--grass);box-shadow:0 0 0 1px var(--grass) inset}
.drill canvas{display:block;width:100%;aspect-ratio:16/10;background:#123a1c}
.drill .meta{padding:.6rem .75rem .75rem}
.drill .meta h3{font-size:1rem;margin-bottom:.25rem}
.drill .meta .sub{color:var(--muted);font-size:.8rem;display:flex;gap:.5rem;
  align-items:center;margin-top:.3rem}
.drill .add{margin-left:auto;font-weight:800;color:var(--grass)}

/* ------------------------------------------------------------- sheet */
.sheet{position:fixed;inset:0;z-index:90;background:rgba(4,10,20,.72);
  display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{width:100%;max-width:46rem;max-height:92svh;overflow:auto;
  background:var(--navy);border:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:0 var(--pad) calc(1.5rem + env(safe-area-inset-bottom))}
.sheet .grab{position:sticky;top:0;background:var(--navy);padding:.55rem 0 .2rem;z-index:2}
.sheet .grab i{display:block;width:40px;height:4px;border-radius:9px;background:#31496a;margin:0 auto}
.sheet h2{font-size:1.35rem;margin:.5rem 0 .1rem}
.sheet canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:13px;
  background:#123a1c;margin:.75rem 0}
.sheet h4{margin:1.05rem 0 .35rem;font-size:.74rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--rye-lt)}
.sheet ul{margin:.2rem 0;padding-left:1.15rem}
.sheet li{margin:.3rem 0}
.sheet .foot{position:sticky;bottom:0;background:var(--navy);padding:.85rem 0 .3rem;margin-top:.7rem}
.sheet .foot::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:1.6rem;
  background:linear-gradient(transparent,var(--navy));pointer-events:none}

/* ------------------------------------------------- run-the-warm-up mode */
.runner{position:fixed;inset:0;z-index:70;background:var(--navy);
  display:flex;flex-direction:column;padding:calc(.8rem + env(safe-area-inset-top)) var(--pad)
  calc(1rem + env(safe-area-inset-bottom))}
.runner .head{display:flex;align-items:center;gap:.6rem}
.runner .head .of{color:var(--muted);font-size:.85rem;font-weight:700}
.runner h2{font-size:1.5rem;margin:.5rem 0 0}
.runner .big{font-size:clamp(4rem,22vw,8rem);font-weight:800;text-align:center;
  font-variant-numeric:tabular-nums;line-height:1;margin:.4rem 0;letter-spacing:-.03em}
.runner .big.low{color:var(--gold)}
.runner canvas{display:block;width:100%;flex:1 1 auto;min-height:34svh;max-height:52svh;
  border-radius:14px;background:#123a1c;margin-top:.35rem}
.runner .spacer{flex:1;min-height:0}
.runner .pts{margin:.6rem 0 0;color:var(--muted);font-size:.88rem}
.runner .ctl{display:flex;gap:.5rem;margin-top:.7rem}
.runner .ctl .btn{flex:1}

/* ------------------------------------------------------------ match tab */
.field{display:flex;align-items:center;gap:.6rem;margin:.55rem 0}
.field label{flex:none;width:9.5rem;font-size:.9rem;color:var(--muted);font-weight:600}
.field .ctl{flex:1;display:flex;gap:.4rem;align-items:center}
.stepper{display:flex;align-items:center;gap:.5rem}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);font-weight:800;font-size:1.1rem}
.stepper b{min-width:4.6rem;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:.3rem;flex-wrap:wrap}
.seg button{padding:.4rem .7rem;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button small{display:block;font-size:.66rem;font-weight:700;opacity:.7;margin-top:.05rem}
.seg button[aria-pressed=true]{background:var(--rye);border-color:var(--rye-lt);color:#fff}

.roster{margin:.6rem 0 0}
.pl{display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:.4rem}
.pl.out{opacity:.45}
.pl input[type=text]{flex:1;min-width:0;background:transparent;border:0;outline:0;
  font-size:1rem;font-weight:600;padding:.25rem 0}
.tog{flex:none;display:grid;place-items:center;min-width:44px;padding:0 .45rem;height:34px;border-radius:9px;
  background:#0d1e35;border:1px solid var(--line);font-size:.72rem;font-weight:800;color:var(--muted)}
.tog[aria-pressed=true]{background:var(--grass);border-color:#4ade80;color:#04220f}
.tog.gk[aria-pressed=true]{background:var(--gold);border-color:#fde68a;color:#3a2c05}
.pl .del{flex:none;width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:1.1rem}

.tl{margin:.5rem 0 0}
.tl .r{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.tl .r .nm{width:6.4rem;flex:none;font-size:.85rem;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tl .r .bar{flex:1;display:flex;height:22px;border-radius:6px;overflow:hidden;background:#0a1628;gap:1px}
.tl .r .bar i{display:block;background:#1e3350}
.tl .r .bar i.on{background:var(--grass)}
.tl .r .bar i.gk{background:var(--gold)}
.tl .r .mins{flex:none;width:3.1rem;text-align:right;font-size:.82rem;
  font-variant-numeric:tabular-nums;color:var(--muted)}
.tl .r .mins b{color:var(--ink)}
.legend{display:flex;gap:.9rem;color:var(--muted);font-size:.78rem;margin-top:.5rem}
.legend s{width:11px;height:11px;border-radius:3px;display:inline-block;
  vertical-align:-1px;margin-right:.3rem}

/* --------------------------------------------------------- live match */
.live{position:fixed;inset:0;z-index:70;background:var(--navy);overflow:auto;
  padding:calc(.6rem + env(safe-area-inset-top)) var(--pad)
  calc(1.1rem + env(safe-area-inset-bottom))}
.live .bar{display:flex;align-items:center;gap:.5rem}
.live .bar .half{font-weight:800;letter-spacing:.09em;font-size:.8rem;color:var(--rye-lt)}
.clock{font-size:clamp(3.6rem,20vw,7rem);font-weight:800;text-align:center;
  font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.035em;margin:.15rem 0 0}
.clock.paused{color:var(--muted)}
.clock.ht{color:var(--gold)}
.subclock{text-align:center;color:var(--muted);font-size:.9rem;font-weight:700;
  font-variant-numeric:tabular-nums}
.subclock b{color:var(--gold)}
.alert{margin:.6rem 0 0;padding:.7rem .85rem;border-radius:14px;background:#7c2d12;
  border:1px solid var(--warn);font-weight:700}
.alert.flash{animation:fl .8s steps(1,end) infinite}
@keyframes fl{50%{background:#9a3412;border-color:#fdba74}}
.alert .sw{display:block;font-size:.95rem;margin-top:.25rem;font-weight:600}
.alert .sw em{font-style:normal;color:#fed7aa}

.pitch{position:relative;margin:.7rem 0 0;border-radius:15px;overflow:hidden;
  aspect-ratio:1/1.12;max-height:40svh;background:
   repeating-linear-gradient(180deg,#2a8a3d 0 12.5%,#25803a 12.5% 25%)}
.pitch .lines{position:absolute;inset:0;pointer-events:none}
.shirt{position:absolute;transform:translate(-50%,-50%);width:5.4rem;text-align:center;
  touch-action:none;cursor:grab;transition:opacity .12s}
.shirt.drag{opacity:.3}
.shirt.ghostly{position:fixed;z-index:200;pointer-events:none;opacity:.95;
  transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.shirt .d{transition:transform .12s,box-shadow .12s}
.shirt.drop .d{box-shadow:0 0 0 4px var(--gold);transform:scale(1.08)}
.shirt .d{width:2.6rem;height:2.6rem;margin:0 auto;border-radius:99px;
  background:#f8fafc;color:#0a1628;display:grid;place-items:center;
  font-weight:800;font-size:1.05rem;border:3px solid #0a1628;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.shirt.k .d{background:var(--gold);border-color:#7a5c00}
.shirt .n{margin-top:.2rem;font-size:.82rem;font-weight:800;
  text-shadow:0 1px 4px rgba(0,0,0,.85);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench{margin:.7rem 0 0;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.bench .lab{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:800;width:100%}
.bench .b{padding:.3rem .65rem;border-radius:99px;background:var(--panel);
  border:1px solid var(--line);font-size:.86rem;font-weight:700;color:var(--muted);
  touch-action:none;cursor:grab;transition:opacity .12s,box-shadow .12s}
.bench .b.drag{opacity:.3}
.bench .b.drop{box-shadow:0 0 0 3px var(--gold);color:var(--ink)}
.hint{margin:.5rem 0 0;color:var(--muted);font-size:.78rem;text-align:center;line-height:1.35}
.bench .b.next{background:#14361f;border-color:var(--grass);color:#bbf7d0}
.live .ctl{display:flex;gap:.5rem;margin:.8rem 0 0}
.live .ctl .btn{flex:1}
.live .ctl2{display:flex;gap:.5rem;margin:.5rem 0 0}
.live .ctl2 .btn{flex:1;padding:.55rem .6rem;font-size:.85rem}
details.mins{margin:.8rem 0 0}
details.mins summary{cursor:pointer;color:var(--rye-lt);font-weight:700;font-size:.9rem}
table.mins{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.9rem}
table.mins td,table.mins th{padding:.35rem .3rem;border-bottom:1px solid var(--line);text-align:right}
table.mins th:first-child,table.mins td:first-child{text-align:left}
table.mins th{color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
table.mins td{font-variant-numeric:tabular-nums}
footer{text-align:center;color:#5c6a85;font-size:.78rem;padding:1.6rem 0 .5rem}
</style>
<script src="fresh.js" defer></script>
</head>

<header>
  <div class="wrap">
    <div class="brand">
      <svg class="crest" viewBox="0 0 34 40" aria-hidden="true">
        <path d="M2 3h30v22c0 7-8 11-15 14C10 36 2 32 2 25z" fill="#2563eb" stroke="#dbeafe" stroke-width="2"/>
        <circle cx="17" cy="19" r="8" fill="#fff"/>
        <path d="M17 13.4l4.6 3.3-1.75 5.4h-5.7l-1.75-5.4z" fill="#0a1628"/>
        <path d="M17 13.4V9M21.6 16.7l4-1.3M20.15 22.1l2.6 3.4M13.85 22.1l-2.6 3.4M12.4 16.7l-4-1.3"
              stroke="#0a1628" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="t1">RYE YOUTH SOCCER</div>
        <div class="t2">COACH&rsquo;S SIDELINE KIT</div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabWarm" role="tab" aria-selected="true">Warm-Up</button>
      <button id="tabMatch" role="tab" aria-selected="false">Match Day</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="paneWarm"></section>
  <section id="paneMatch" class="hide"></section>
  <footer>Rye Youth Soccer &middot; 4-a-side &middot; built for the touchline</footer>
</main>

<div id="sheet"></div>
<div id="runner"></div>
<div id="live"></div>

<script>
"use strict";
/* ==========================================================================
   Rye Youth Soccer - coach's sideline kit

   Two tools, one page, no server. The warm-up half is a library of drills a
   parent-coach can run with seven-to-nine year olds, each one drawn as a
   little moving picture so you can see the shape of it before you set the
   cones out. The match half keeps the clock for a 4-a-side game and works
   out, in advance, who is on the pitch and who is in goal at every minute,
   so every child gets about the same number of minutes and everybody takes
   a turn in goal.

   Everything is held in localStorage under "rye." so the squad you typed in
   last Saturday is still there next Saturday.
   ====================================================================== */

var $ = function (s, r) { return (r || document).querySelector(s); };
var save = function (k, v) { try { localStorage.setItem("rye." + k, JSON.stringify(v)); } catch (e) {} };
var load = function (k, d) {
  try { var v = localStorage.getItem("rye." + k); return v == null ? d : JSON.parse(v); }
  catch (e) { return d; }
};
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}
function mmss(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

/* A short blip and a buzz, for the moments the coach is looking at the pitch
   and not at the phone. The audio context is made on the first tap, which is
   the only time a browser will let us have one. */
var actx = null;
function beep(times, hz) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    for (var i = 0; i < (times || 1); i++) {
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.26;
      o.type = "square"; o.frequency.value = hz || 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.22);
    }
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(times > 1 ? [120, 90, 120, 90, 160] : 120); } catch (e) {}
}

/* Hold the screen awake while a clock is running. Fails silently where the
   browser has no wake lock, which is most of them; on an iPhone added to the
   home screen it works. */
var wl = null;
function wake(on) {
  try {
    if (on && !wl && navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(function (l) { wl = l; }, function () {});
    } else if (!on && wl) { wl.release(); wl = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && wl === null && wakeWanted) wake(true);
});
var wakeWanted = false;

/* ========================================================== drill drawing
   Every diagram is drawn in the same 100 x 62 box of "field units" and then
   scaled to whatever canvas it lands in, so the same drill function serves
   the little card on the shelf and the big picture in the detail sheet.
   t runs 0 to 1 and loops, so a drill draws one cycle of itself. */

var COL = { home: "#2563eb", away: "#ef4444", neutral: "#facc15", coach: "#f8fafc" };

function gfx(ctx, w, h) {
  var s = Math.min(w / 100, h / 62), ox = (w - 100 * s) / 2, oy = (h - 62 * s) / 2;
  var g = {
    ctx: ctx, s: s,
    X: function (x) { return ox + x * s; },
    Y: function (y) { return oy + y * s; },
    U: function (u) { return u * s; }
  };

  g.grass = function () {
    ctx.fillStyle = "#256f33"; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 7; i++) {
      ctx.fillStyle = i % 2 ? "#2a7d3a" : "#237030";
      ctx.fillRect(0, h * i / 7, w, h / 7 + 1);
    }
  };
  g.area = function (x, y, ww, hh, dash) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.72)"; ctx.lineWidth = Math.max(1, g.U(0.7));
    if (dash) ctx.setLineDash([g.U(2), g.U(2)]);
    ctx.strokeRect(g.X(x), g.Y(y), g.U(ww), g.U(hh));
    ctx.restore();
  };
  g.circle = function (x, y, r) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = Math.max(1, g.U(0.6));
    ctx.beginPath(); ctx.arc(g.X(x), g.Y(y), g.U(r), 0, 7); ctx.stroke();
    ctx.restore();

/* movement helpers ------------------------------------------------------ */
function along(pts, u) {
  u = Math.max(0, Math.min(1, u));
  var segs = [], total = 0, i;
  for (i = 1; i < pts.length; i++) {
    var d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(d); total += d;
  }
  if (!total) return [pts[0][0], pts[0][1]];
  var want = u * total, run = 0;
  for (i = 0; i < segs.length; i++) {
    if (run + segs[i] >= want) {
      var f = segs[i] ? (want - run) / segs[i] : 0;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f,
              pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];
    }
    run += segs[i];
  }
  return [pts[pts.length - 1][0], pts[pts.length - 1][1]];
}
/* progress inside a slice of the loop: window(t, .2, .6) is 0 before 20%,
   ramps to 1 at 60%, then stays 1 */
function win(t, a, b) { return Math.max(0, Math.min(1, (t - a) / (b - a))); }
function ping(t) { return t < 0.5 ? t * 2 : 2 - t * 2; }
function orbit(cx, cy, rx, ry, u, phase) {
  var a = (u + (phase || 0)) * Math.PI * 2;
  return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry];
}

/* ====================================================== the drawing loop
   One animation frame for the whole page. Any canvas that is registered and
   currently on screen gets redrawn; anything scrolled away or removed from
   the document costs nothing. */
var ANIM = [], LOOP = 6.5;
function regAnim(cv, drill, loopSecs) {
  ANIM.push({ cv: cv, drill: drill, loop: loopSecs || LOOP });
  return cv;
}
(function frame(now) {
  requestAnimationFrame(frame);
  var dpr = Math.min(2, window.devicePixelRatio || 1), h = window.innerHeight;
  for (var i = ANIM.length - 1; i >= 0; i--) {
    var a = ANIM[i];
    if (!a.cv.isConnected) { ANIM.splice(i, 1); continue; }
    var r = a.cv.getBoundingClientRect();
    if (!r.width || !r.height || r.bottom < -60 || r.top > h + 60) continue;
    var W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
    if (a.cv.width !== W || a.cv.height !== H) { a.cv.width = W; a.cv.height = H; }
    var ctx = a.cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var t = ((now || 0) / 1000 / a.loop) % 1;
    try { a.drill.draw(gfx(ctx, r.width, r.height), t); } catch (e) {}
  }
})(0);

/* =========================================================== match day
   A 4-a-side game is 2 x 18 minutes with a 4 minute half-time. Four on the
   pitch, one of them in goal, and anywhere between four and eight children
   on the touchline wanting to know when it is their turn.

   The plan is worked out as a grid of shifts. At each shift the four with
   the fewest minutes so far go on, and of those four the one who has spent
   least time in goal goes in goal. Doing it by "fewest so far" rather than
   by a fixed rotation means the plan survives a child arriving late, going
   off with a bumped knee or needing the loo: re-plan from the clock and the
   remaining shifts quietly even everything back up.
   ====================================================================== */

var squad = load("squad", []);
var cfg = load("cfg", { halves: 2, halfMin: 18, htMin: 4, shifts: 4, onField: 4 });
var nextPid = load("nextPid", 1);

function saveSquad() { save("squad", squad); }
function tidySquad() {
  var n = squad.length;
  squad = squad.filter(function (p) { return p.name.trim(); });
  if (squad.length !== n) saveSquad();
}
function addPlayer(name) {
  var p = { id: nextPid++, name: name || "", on: true, gk: true };
  squad.push(p); save("nextPid", nextPid); saveSquad();
  return p;
}
function available() { return squad.filter(function (p) { return p.on && p.name.trim(); }); }

/* --------------------------------------------------------- the planner */

/* The shifts of the match, as windows on the clock. From a standing start
   that is each half cut into equal pieces. After an early change it is the
   rest of the current half shared between the shifts that are left, and
   then whole halves after that. */
function planWindows(conf, fromT, remainInHalf) {
  var halfSec = conf.halfMin * 60, W = [];
  fromT = fromT || 0;
  for (var h = 0; h < conf.halves; h++) {
    var hs = h * halfSec, he = hs + halfSec;
    if (he <= fromT + 0.001) continue;
    var start = Math.max(hs, fromT);
    var n = start > hs + 0.001 ? Math.max(1, remainInHalf || 1) : conf.shifts;
    var span = (he - start) / n;
    for (var s = 0; s < n; s++) W.push({ half: h, start: start + s * span, end: start + (s + 1) * span });
  }
  return W;
}

/* Fill those windows. seed carries the minutes already served, so a plan
   made in the middle of a game knows who is owed time. k0 keeps the
   tie-break walking round the squad rather than restarting at the top. */
function buildPlan(players, conf, windows, seed, k0) {
  var N = players.length;
  if (!N || !windows || !windows.length) return [];
  var F = Math.min(conf.onField, N);
  var played = {}, gkSec = {}, idx = {};
  players.forEach(function (p, i) {
    idx[p.id] = i;
    played[p.id] = (seed && seed.played[p.id]) || 0;
    gkSec[p.id] = (seed && seed.gk[p.id]) || 0;
  });
  var segs = [], lastGk = (seed && seed.lastGk) || null, onNow = {};
  (seed && seed.onNow || []).forEach(function (id) { onNow[id] = true; });

  windows.forEach(function (w, j) {
    var k = (k0 || 0) + j, len = w.end - w.start;

    /* who goes on: fewest minutes first, then whoever is having a rest,
       then a tie-break that walks round the squad so the same names do not
       always win the coin toss */
    var order = players.slice().sort(function (a, b) {
      return (played[a.id] - played[b.id]) ||
             ((onNow[a.id] ? 1 : 0) - (onNow[b.id] ? 1 : 0)) ||
             (((idx[a.id] + k) % N) - ((idx[b.id] + k) % N));
    });
    var on = order.slice(0, F);

    /* somebody out there has to be willing to go in goal */
    if (!on.some(function (p) { return p.gk; })) {
      var swap = order.slice(F).filter(function (p) { return p.gk; })[0];
      if (swap) on[F - 1] = swap;
    }

    /* and of those, whoever has had least of it */
    var kOrder = on.filter(function (p) { return p.gk; });
    if (!kOrder.length) kOrder = on.slice();
    kOrder.sort(function (a, b) {
      return (gkSec[a.id] - gkSec[b.id]) ||
             ((a.id === lastGk ? 1 : 0) - (b.id === lastGk ? 1 : 0)) ||
             (((idx[a.id] + k) % N) - ((idx[b.id] + k) % N));
    });
    var gk = kOrder[0];

    /* the keeper is held at the front of the lineup, so the pitch can be
       drawn straight from it and a drag onto the goalkeeper's shirt is
       simply a swap into slot nought */
    var onIds = [gk.id].concat(on.filter(function (q) { return q !== gk; })
                                 .map(function (q) { return q.id; }));
    segs.push({
      half: w.half, start: w.start, end: w.end, on: onIds, gk: gk.id,
      off: players.filter(function (p) { return onIds.indexOf(p.id) < 0; })
                  .map(function (p) { return p.id; })
    });
    onNow = {}; onIds.forEach(function (id) { onNow[id] = true; });
    onIds.forEach(function (id) { played[id] += len; });
    gkSec[gk.id] += len;
    lastGk = gk.id;
  });
  return segs;
}

/* minutes actually served, reading the plan up to a moment on the clock */
function tally(segs, upto, ids) {
  var played = {}, gk = {};
  (ids || []).forEach(function (id) { played[id] = 0; gk[id] = 0; });
  segs.forEach(function (s) {
    var len = Math.max(0, Math.min(s.end, upto) - s.start);
    if (len <= 0) return;
    s.on.forEach(function (id) { played[id] = (played[id] || 0) + len; });
    gk[s.gk] = (gk[s.gk] || 0) + len;
  });
  return { played: played, gk: gk };
}

function nameOf(id) {
  for (var i = 0; i < squad.length; i++) if (squad[i].id === id) return squad[i].name.trim() || "?";
  return "?";
}
function firstNames(ids) { return ids.map(nameOf).join(", "); }

/* ==================================================== match-day setup UI
   The squad list is built once and then edited in place. It used to be
   thrown away and rebuilt whenever anything changed, which meant that
   tapping from one name box to the next destroyed the box you were leaving
   mid-tap: on a phone the keyboard shut and the tap landed on nothing. Now
   a name box lives as long as the player does, and only the count, the
   shift labels and the plan below are redrawn while you type. */
var MD = null, planTimer = null;

function schedulePlan() { clearTimeout(planTimer); planTimer = setTimeout(refreshPlan, 250); }

function nameRow(p) {
  var row = el("div", { class: "pl" + (p.on ? "" : " out") });
  var inp = el("input", { type: "text", value: p.name, placeholder: "Name",
    autocomplete: "off", autocorrect: "off", spellcheck: "false",
    autocapitalize: "words", enterkeyhint: "next" });
  inp.addEventListener("input", function () { p.name = inp.value; saveSquad(); schedulePlan(); });
  inp.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    /* Enter walks down the list, and makes a new name box at the bottom, so
       a whole squad goes in without touching the screen again */
    var boxes = Array.prototype.slice.call(MD.list.querySelectorAll("input"));
    var next = boxes[boxes.indexOf(inp) + 1];
    if (next) { next.focus(); next.select(); }
    else { newNameRow(); }
  });
  row.appendChild(inp);

  var here = el("button", { class: "tog", text: "HERE", "aria-pressed": String(!!p.on) });
  here.addEventListener("click", function () {
    p.on = !p.on; saveSquad();
    here.setAttribute("aria-pressed", String(!!p.on));
    row.className = "pl" + (p.on ? "" : " out");
    refreshPlan();
  });
  row.appendChild(here);

  var keeps = el("button", { class: "tog gk", text: "GK", "aria-pressed": String(!!p.gk) });
  keeps.addEventListener("click", function () {
    p.gk = !p.gk; saveSquad();
    keeps.setAttribute("aria-pressed", String(!!p.gk));
    refreshPlan();
  });
  row.appendChild(keeps);

  row.appendChild(el("button", { class: "del", text: "\u00d7", "aria-label": "Remove " + (p.name || "player"),
    onclick: function () {
      squad = squad.filter(function (q) { return q !== p; });
      saveSquad(); row.remove(); refreshPlan();
    } }));
  return row;
}

function newNameRow(name) {
  var p = addPlayer(name || "");
  var row = nameRow(p);
  MD.list.appendChild(row);
  refreshPlan();
  var inp = row.querySelector("input");
  if (inp) inp.focus();
  return p;
}

function renderMatch() {
  var pane = $("#paneMatch");
  pane.textContent = "";
  MD = {};

  ]));

  MD.resume = el("div", {});

  MD.hereCount = el("span", { class: "note", style: "margin-left:auto" });

           "padding:.55rem .7rem;color:var(--ink);font:inherit;resize:vertical;margin-top:.5rem"
  });
  box.appendChild(el("div", { class: "row", style: "margin-top:.5rem" }, [
    el("button", { class: "btn", text: "+ Add a player", onclick: function () { newNameRow(); } }),
    el("button", { class: "btn ghost", text: "Paste a list", onclick: function () {

      if (MD.ta.style.display === "block") MD.ta.focus();
    } })
  ]));
  MD.ta.style.display = squad.length ? "none" : "block";
  function takeList() {
    var names = MD.ta.value.split(/[\n,]/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!names.length) return;
    names.forEach(function (n) {
      var p = addPlayer(n);

  }

  /* --- the shape of the game ----------------------------------------- */
  var set = el("div", { class: "card", style: "padding:.85rem;margin-top:.7rem" }, [

  ]);
  function stepper(label, key, min, max, step, unit) {
    var b = el("b", { text: cfg[key] + (unit || "") });
    function bump(d) {
      cfg[key] = Math.max(min, Math.min(max, cfg[key] + d));
      b.textContent = cfg[key] + (unit || "");
      save("cfg", cfg); refreshPlan();
    }
    return el("div", { class: "field" }, [

      el("div", { class: "ctl" }, [el("div", { class: "stepper" }, [
        el("button", { text: "\u2212", "aria-label": "less", onclick: function () { bump(-step); } }),

      ])])

  }

  set.appendChild(stepper("Half-time", "htMin", 0, 15, 1, " min"));

  MD.shiftRow = el("div", { class: "seg" });
  set.appendChild(el("div", { class: "field" }, [
    el("label", { text: "Shifts per half" }), el("div", { class: "ctl" }, [MD.shiftRow])
  ]));

  MD.fieldRow = el("div", { class: "seg" });
  [3, 4, 5].forEach(function (n) {
    MD.fieldRow.appendChild(el("button", { text: n + " a side", "aria-pressed": String(cfg.onField === n),
      onclick: function () { cfg.onField = n; save("cfg", cfg); refreshPlan(); } }));
  });
  set.appendChild(el("div", { class: "field" }, [
    el("label", { text: "On the pitch" }), el("div", { class: "ctl" }, [MD.fieldRow])
  ]));
  pane.appendChild(set);

  MD.planBox = el("div", {});
  pane.appendChild(MD.planBox);
  refreshPlan();
}

/* Everything below the squad list, redrawn whenever the squad or the shape
   of the game changes. Never touches the name boxes. */
function refreshPlan() {
  if (!MD) return;
  var pl = available();
  MD.hereCount.textContent = plural(pl.length, "player") + " here today";
  MD.ta.style.display = squad.length ? MD.ta.style.display : "block";

  /* a game left half-played, offered back */
  MD.resume.textContent = "";
  var saved = load("live", null);
  if (saved && !saved.done && saved.segs && saved.segs.length && Date.now() - saved.at < 6 * 3600e3) {
    MD.resume.appendChild(el("div", { class: "card",
      style: "padding:.8rem;margin-top:.7rem;border-color:var(--grass)" }, [
      el("div", { class: "note", html: "There is a game in progress \u2014 <b>" + mmss(saved.t) + "</b> played." }),
      el("div", { class: "row", style: "margin-top:.55rem" }, [
        el("button", { class: "btn go", text: "Back to the game",
          onclick: function () { resumeMatch(saved); } }),
        el("button", { class: "btn ghost", text: "Forget it",
          onclick: function () { save("live", null); refreshPlan(); } })
      ])
    ]));
  }

  /* How evenly a shift count divides today depends on how many turned up:
     six children share four shirts perfectly in threes, five or seven do
     not. Rather than choose for the coach, show what each one costs. */
  function spreadFor(n) {
    if (pl.length < cfg.onField) return null;
    var c = { halves: cfg.halves, halfMin: cfg.halfMin, shifts: n, onField: cfg.onField };
    var ss = buildPlan(pl, c, planWindows(c, 0));
    var tt = tally(ss, cfg.halves * cfg.halfMin * 60, pl.map(function (p) { return p.id; }));
    var m = pl.map(function (p) { return tt.played[p.id] / 60; });
    var gg = pl.map(function (p) { return tt.gk[p.id]; });
    return { d: Math.max.apply(null, m) - Math.min.apply(null, m),
             noGoal: gg.filter(function (x) { return x < 1; }).length };
  }
  MD.shiftRow.textContent = "";
  [2, 3, 4, 6].forEach(function (n) {
    var s = spreadFor(n);
    var sub = !s ? "" : s.noGoal ? "no goal for " + s.noGoal
            : s.d < 0.1 ? "dead even" : "\u00b1" + (Math.round(s.d * 10) / 10) + "m";
    MD.shiftRow.appendChild(el("button", {
      html: n + " \u00d7 " + (Math.round(cfg.halfMin * 60 / n / 6) / 10) + "m" +
            (sub ? "<small>" + sub + "</small>" : ""),
      "aria-pressed": String(cfg.shifts === n),
      onclick: function () { cfg.shifts = n; save("cfg", cfg); refreshPlan(); }
    }));
  });
  Array.prototype.slice.call(MD.fieldRow.children).forEach(function (b, i) {
    b.setAttribute("aria-pressed", String(cfg.onField === [3, 4, 5][i]));
  });

  /* --- the plan ------------------------------------------------------- */
  MD.planBox.textContent = "";
  if (pl.length < cfg.onField) {
    MD.planBox.appendChild(el("p", { class: "note", style: "margin:1rem 0 2rem",
      text: "Type at least " + cfg.onField + " names, marked HERE, and the plan will appear." }));
    return;
  }
  var segs = buildPlan(pl, cfg, planWindows(cfg, 0));
  var total = cfg.halves * cfg.halfMin * 60;
  var sum = tally(segs, total, pl.map(function (p) { return p.id; }));
  var mins = pl.map(function (p) { return sum.played[p.id] / 60; });
  var lo = Math.min.apply(null, mins), hi = Math.max.apply(null, mins);

  var plan = el("div", { class: "card", style: "padding:.85rem;margin-top:.7rem" });
  plan.appendChild(el("div", { style: "display:flex;align-items:baseline;gap:.5rem" }, [
    el("h3", { text: "The plan", style: "font-size:1.05rem" }),
    el("span", { class: "note", style: "margin-left:auto",
      text: (Math.round(lo) === Math.round(hi) ? Math.round(lo) + " min each"
             : Math.round(lo) + "\u2013" + Math.round(hi) + " min each") })
  ]));
  plan.appendChild(el("p", { class: "note", style: "margin:.3rem 0 .6rem",
    html: plural(pl.length, "player") + " \u00b7 " + cfg.halves + " \u00d7 " + cfg.halfMin +
      " min \u00b7 a change every " + (Math.round(cfg.halfMin * 60 / cfg.shifts / 6) / 10) + " min" +
      (hi - lo > 0.1 ? " \u00b7 <b>split " + Math.round((hi - lo) * 10) / 10 + " min</b>" : "") }));

  var tl = el("div", { class: "tl" });
  pl.forEach(function (p) {
    var bar = el("div", { class: "bar" });
    segs.forEach(function (s) {
      var on = s.on.indexOf(p.id) >= 0, isGk = s.gk === p.id;
      bar.appendChild(el("i", { class: isGk ? "gk" : on ? "on" : "",
        style: "flex:1", title: mmss(s.start) + " " + (isGk ? "in goal" : on ? "on" : "off") }));
    });
    tl.appendChild(el("div", { class: "r" }, [
      el("span", { class: "nm", text: p.name.trim() }),
      bar,
      el("span", { class: "mins", html: "<b>" + Math.round(sum.played[p.id] / 60) + "</b>&prime;" })
    ]));
  });
  plan.appendChild(tl);
  plan.appendChild(el("div", { class: "legend" }, [
    el("span", { html: "<s style='background:#2f9e44'></s>on the pitch" }),
    el("span", { html: "<s style='background:#ffd166'></s>in goal" }),
    el("span", { html: "<s style='background:#1e3350'></s>resting" })
  ]));
  plan.appendChild(el("p", { class: "note", style: "margin:.6rem 0 0",
    text: "In goal: " + pl.map(function (p) {
      return p.name.trim() + " " + Math.round(sum.gk[p.id] / 60) + "\u2032"; }).join(" \u00b7 ") }));

  /* with more children than shifts, somebody misses out on goal altogether */
  var noGoal = pl.filter(function (p) { return sum.gk[p.id] < 1; });
  if (noGoal.length) {
    plan.appendChild(el("p", { class: "note", style: "margin:.45rem 0 0;color:var(--gold)",
      html: "\u26a0 " + firstNames(noGoal.map(function (p) { return p.id; })) +
        (noGoal.length === 1 ? " never gets" : " never get") +
        " a turn in goal \u2014 there are more players than shifts. Pick more shifts per half." }));
  }
  var willing = pl.filter(function (p) { return p.gk; }).length;
  if (willing < 2) {
    plan.appendChild(el("p", { class: "note", style: "margin:.45rem 0 0;color:var(--gold)",
      html: "\u26a0 Only " + (willing ? "one player is" : "nobody is") +
        " marked GK, so the plan keeps " + (willing ? "them" : "whoever is on") +
        " in goal far longer than anyone else. Turn GK on for a few more." }));
  }
  plan.appendChild(el("button", { class: "btn go wide", style: "margin-top:.8rem",
    text: "\u25b6  Kick off", onclick: function () { startMatch(segs); } }));
  MD.planBox.appendChild(plan);
  MD.planBox.appendChild(el("p", { class: "note", style: "margin:.8rem 0 1.5rem",
    html: "Nothing is fixed. During the game you can sub early, take a player off or add a late arrival, and the rest of the plan is worked out again from the clock." }));
}

/* ================================================== the game, live
   One screen, held in one hand, readable at arm's length while you are
   looking at the pitch and not at the phone. */
var M = null, MTIMER = null;
var SPOTS = {
  3: [[50, 82], [30, 48], [70, 48]],
  4: [[50, 82], [24, 54], [76, 54], [50, 26]],
  5: [[50, 83], [22, 58], [78, 58], [36, 28], [64, 28]]
};
function halfSec() { return cfg.halfMin * 60; }
function totalSec() { return cfg.halves * halfSec(); }
function elapsed() { return M ? M.t + (M.running ? (Date.now() - M.runFrom) / 1000 : 0) : 0; }
function segAt(t) {
  for (var i = 0; i < M.segs.length; i++) if (t >= M.segs[i].start - 0.001 && t < M.segs[i].end - 0.001) return i;
  return Math.max(0, M.segs.length - 1);
}
function saveMatch() {
  if (!M) return save("live", null);
  save("live", { segs: M.segs, t: elapsed(), half: M.half, ht: M.ht,
    htLeft: M.ht ? Math.max(0, (M.htEnd - Date.now()) / 1000) : 0,
    done: M.done, at: Date.now() });
}

function startMatch(segs) {
  beep(1, 660);
  M = { segs: segs, t: 0, running: false, runFrom: 0, half: 0, ht: false,
        htEnd: 0, done: false, curSeg: 0, alert: null };
  openLive();
}
function resumeMatch(s) {
  M = { segs: s.segs, t: s.t, running: false, runFrom: 0,
        half: Math.min(cfg.halves - 1, Math.floor(s.t / halfSec() + 1e-9)),
        ht: !!s.ht, htEnd: Date.now() + (s.htLeft || 0) * 1000,
        done: !!s.done, curSeg: 0, alert: null };
  M.curSeg = segAt(M.t);
  openLive();
}
function closeLive(keep) {
  if (MTIMER) clearInterval(MTIMER); MTIMER = null;
  if (keep) saveMatch(); else save("live", null);
  M = null; wakeWanted = false; wake(false);
  $("#live").textContent = "";
  tidySquad(); renderMatch();
}

function openLive() {
  var host = $("#live"); host.textContent = "";
  var pitch = el("div", { class: "pitch", id: "lvPitch" });
  pitch.appendChild(el("div", { class: "lines", html:
    '<svg viewBox="0 0 100 112" preserveAspectRatio="none" style="width:100%;height:100%">' +
    '<g fill="none" stroke="rgba(255,255,255,.42)" stroke-width="0.8">' +
    '<rect x="2" y="2" width="96" height="108"/>' +
    '<line x1="2" y1="18" x2="98" y2="18"/>' +
    '<circle cx="50" cy="18" r="13"/>' +
    '<rect x="26" y="88" width="48" height="22"/>' +
    '<rect x="38" y="102" width="24" height="8"/>' +
    '<line x1="38" y1="110" x2="62" y2="110" stroke="rgba(255,255,255,.9)" stroke-width="2"/>' +
    '</g></svg>' }));

  host.appendChild(el("div", { class: "live" }, [
    el("div", { class: "bar" }, [
      el("span", { class: "half", id: "lvHalf", text: "1ST HALF" }),
      el("span", { class: "note", id: "lvMeta" }),
      el("button", { class: "btn ghost", style: "margin-left:auto;padding:.4rem .7rem",
        text: "Close", onclick: function () { closeLive(!M.done); } })
    ]),
    el("div", { class: "clock", id: "lvClock", text: "0:00" }),
    el("div", { class: "subclock", id: "lvSub" }),
    el("div", { id: "lvAlert" }),
    pitch,
    el("div", { class: "bench", id: "lvBench" }),
    el("p", { class: "hint", id: "lvHint",
      html: "Drag a player onto another to swap them over \u2014 onto someone resting to make the change, or onto the keeper to put them in goal." }),
    el("div", { class: "ctl" }, [
      el("button", { class: "btn go", id: "lvStart", text: "▶ Start", onclick: toggleClock }),
      el("button", { class: "btn", id: "lvSubNow", text: "Sub now", onclick: function () {
        if (!M || M.done || M.ht) return;
        replanFrom(elapsed(), true); saveMatch(); paintLive();
      } })
    ]),
    el("div", { class: "ctl2" }, [
      el("button", { class: "btn ghost", text: "Who's here", onclick: openSquadSheet }),
      el("button", { class: "btn ghost", id: "lvEnd", text: "End match", onclick: function () {
        if (!M) return;
        if (!confirm("End the match and keep the minutes played?")) return;
        M.t = elapsed(); M.running = false; M.done = true; M.ht = false; M.sig = "";
        wake(false); beep(3, 440); saveMatch(); paintLive();
      } })
    ]),
    el("details", { class: "mins" }, [
      el("summary", { text: "Minutes so far" }),
      el("div", { id: "lvMins" })
    ])
  ]));
  M.curSeg = segAt(elapsed());
  M.sig = "";
  paintLive();
  if (MTIMER) clearInterval(MTIMER);
  MTIMER = setInterval(tickMatch, 250);
}

function toggleClock() {
  if (!M) return;
  if (M.done) return;
  if (M.ht) {                                   /* kick off the next half */
    M.ht = false; M.half++;
    M.t = M.half * halfSec(); M.runFrom = Date.now(); M.running = true;
    M.curSeg = segAt(M.t); M.alert = null;
    beep(1, 660); wakeWanted = true; wake(true);
  } else if (M.running) {
    M.t = elapsed(); M.running = false; wake(false); wakeWanted = false;
  } else {
    M.runFrom = Date.now(); M.running = true; wakeWanted = true; wake(true);
    if (!actx) beep(1, 660);
  }
  saveMatch(); paintLive();
}

function tickMatch() {
  if (!M) return;
  if (!M.ht && !M.done) {
    var e = elapsed(), halfEnd = (M.half + 1) * halfSec();
    if (e >= halfEnd - 0.001) {
      M.t = halfEnd; M.running = false; wake(false); wakeWanted = false;
      if (M.half + 1 >= cfg.halves) { M.done = true; M.sig = ""; beep(3, 440); }
      else {
        M.ht = true; M.htEnd = Date.now() + cfg.htMin * 60000; beep(3, 520);
        /* through the break, show the four who start the second half - that
           is what a coach spends those four minutes deciding */
        M.curSeg = segAt(M.t); M.sig = "";
      }
      M.alert = null; saveMatch();
    } else {
      var i = segAt(e);
      if (i !== M.curSeg) {
        announce(M.segs[M.curSeg], M.segs[i]);
        M.curSeg = i; saveMatch();
      }
    }
  }
  paintLive();
  if (!M.tickSave || Date.now() - M.tickSave > 5000) { M.tickSave = Date.now(); saveMatch(); }
}

function announce(prev, cur) {
  if (!prev || !cur) return;
  var off = prev.on.filter(function (id) { return cur.on.indexOf(id) < 0; });
  var on = cur.on.filter(function (id) { return prev.on.indexOf(id) < 0; });
  if (!off.length && !on.length && prev.gk === cur.gk) return;
  M.alert = { until: Date.now() + 40000, off: off, on: on,
              gk: cur.gk, gkNew: prev.gk !== cur.gk };
  beep(2, 920);
}

function replanFrom(atT, announceIt) {
  var pl = available();
  if (!pl.length) return;
  var ids = squad.map(function (p) { return p.id; });
  var seed = tally(M.segs, atT, ids);
  var kept = [];
  M.segs.forEach(function (s) {
    if (s.end <= atT + 0.001) kept.push(s);
    else if (s.start < atT - 0.001)
      kept.push({ half: s.half, start: s.start, end: atT, on: s.on, gk: s.gk, off: s.off });
  });
  var last = kept.length ? kept[kept.length - 1] : null;
  seed.lastGk = last ? last.gk : null;
  seed.onNow = last ? last.on : [];
  var h0 = Math.min(cfg.halves - 1, Math.floor(atT / halfSec() + 1e-9));
  var remain = M.segs.filter(function (s) { return s.half === h0 && s.end > atT + 0.001; }).length;
  var fresh = buildPlan(pl, cfg, planWindows(cfg, atT, remain), seed, kept.length);
  if (!fresh.length) return;
  M.segs = kept.concat(fresh);
  M.curSeg = segAt(atT);
  if (announceIt) announce(last, M.segs[M.curSeg]);
}

/* ------------------------------------------------------------- painting */
function paintLive() {
  if (!M) return;
  var e = Math.min(elapsed(), totalSec());
  var seg = M.segs[M.curSeg] || M.segs[M.segs.length - 1];
  var clock = $("#lvClock"), sub = $("#lvSub"), half = $("#lvHalf");
  if (!clock) return;

  if (M.done) {
    half.textContent = "FULL TIME";
    clock.textContent = mmss(e); clock.className = "clock";
    sub.textContent = "Well played.";
  } else if (M.ht) {
    var left = Math.max(0, (M.htEnd - Date.now()) / 1000);
    half.textContent = "HALF TIME";
    clock.textContent = mmss(left); clock.className = "clock ht";
    sub.innerHTML = (left > 0 ? "Back on in <b>" + mmss(left) + "</b>"
      : "<b>Ready for the second half</b>") + " · these four start";
  } else {
    half.textContent = (M.half === 0 ? "1ST" : M.half === 1 ? "2ND" : (M.half + 1) + "TH") + " HALF";
    clock.textContent = mmss(e - M.half * halfSec());
    clock.className = "clock" + (M.running ? "" : " paused");
    var till = seg.end - e;
    var lastOfHalf = seg.end >= (M.half + 1) * halfSec() - 0.01;
    if (lastOfHalf) {
      sub.innerHTML = (M.half + 1 >= cfg.halves ? "Full time in " : "Half-time in ") +
        "<b>" + mmss(till) + "</b>";
    } else {
      var nxt = M.segs[M.curSeg + 1];
      var coming = nxt ? nxt.on.filter(function (id) { return seg.on.indexOf(id) < 0; }) : [];
      var going = nxt ? seg.on.filter(function (id) { return nxt.on.indexOf(id) < 0; }) : [];
      sub.innerHTML = "Next change in <b>" + mmss(till) + "</b>" +
        (going.length ? " · off " + firstNames(going) : "") +
        (coming.length ? " · on " + firstNames(coming) : "");
    }
  }
  $("#lvMeta").textContent = plural(available().length, "player") + " · " +
    cfg.halfMin + " min halves";

  var sb = $("#lvStart");
  if (sb) {
    sb.textContent = M.done ? "Match over" : M.ht ? "\u25b6 Start the next half"
      : M.running ? "Pause" : (e > 0 ? "\u25b6 Resume" : "\u25b6 Kick off");
    sb.className = "btn" + (M.running || M.done ? "" : " go");
    sb.disabled = !!M.done;
  }
  var sn = $("#lvSubNow");
  if (sn) sn.disabled = !!(M.done || M.ht);

  /* the change banner */
  var ah = $("#lvAlert");
  if (M.alert && Date.now() < M.alert.until && !M.done && !M.ht) {
    var fresh2 = Date.now() < M.alert.until - 34000;
    if (ah.dataset.k !== String(M.alert.until)) {
      ah.textContent = ""; ah.dataset.k = String(M.alert.until);
      ah.appendChild(el("div", { class: "alert" + (fresh2 ? " flash" : "") }, [
        el("span", { text: "CHANGE NOW" }),
        el("span", { class: "sw", html:
          (M.alert.off.length ? "<em>Off:</em> " + firstNames(M.alert.off) + "<br>" : "") +
          (M.alert.on.length ? "<em>On:</em> " + firstNames(M.alert.on) + "<br>" : "") +
          (M.alert.gkNew ? "<em>In goal:</em> " + nameOf(M.alert.gk) : "") })
      ]));
    } else if (!fresh2) {
      var a = ah.firstChild; if (a) a.className = "alert";
    }
  } else if (ah.dataset.k) { ah.textContent = ""; delete ah.dataset.k; }

  /* the pitch and the bench, redrawn only when the names change */
  var sig = seg.on.join(",") + "|" + seg.gk + "|" + (M.segs[M.curSeg + 1] || {}).on;
  if (sig !== M.sig && !DRAGGING) {
    M.sig = sig;
    var pitch = $("#lvPitch");
    Array.prototype.slice.call(pitch.querySelectorAll(".shirt")).forEach(function (n) { n.remove(); });
    var spots = SPOTS[Math.min(5, Math.max(3, seg.on.length))] || SPOTS[4];
    seg.on.forEach(function (id, i) {
      var sp = spots[i] || [50, 50];
      var sh = el("div", {
        class: "shirt" + (i === 0 ? " k" : ""), "data-pid": String(id),
        style: "left:" + sp[0] + "%;top:" + sp[1] + "%"
      }, [
        el("div", { class: "d", text: i === 0 ? "GK" : ((nameOf(id).trim()[0] || "?").toUpperCase()) }),
        el("div", { class: "n", text: nameOf(id) })
      ]);
      draggable(sh, id);
      pitch.appendChild(sh);
    });
    var bench = $("#lvBench"); bench.textContent = "";
    bench.appendChild(el("span", { class: "lab", text: "Resting" }));
    var nxt2 = M.done ? null : M.segs[M.curSeg + 1];
    if (!seg.off.length) bench.appendChild(el("span", { class: "note", text: "Nobody — everyone is on." }));
    seg.off.forEach(function (id) {
      var next = nxt2 && nxt2.on.indexOf(id) >= 0;
      var chip = el("span", { class: "b" + (next ? " next" : ""), "data-pid": String(id),
        text: nameOf(id) + (next ? " ↑" : "") });
      draggable(chip, id);
      bench.appendChild(chip);
    });
    var hint = $("#lvHint");
    if (hint) hint.style.display = load("dragged", false) ? "none" : "";
  }

  /* the minutes table, only while the drawer is open */
  var det = $("#lvMins");
  if (det && det.parentNode.open) {
    var ids = squad.map(function (p) { return p.id; });
    var t = tally(M.segs, e, ids), tEnd = tally(M.segs, totalSec(), ids);
    var tb = el("table", { class: "mins" });
    tb.appendChild(el("tr", {}, [el("th", { text: "Player" }), el("th", { text: "Played" }),
      el("th", { text: "In goal" }), el("th", { text: "Ends on" })]));
    squad.filter(function (p) { return p.name.trim() && (t.played[p.id] > 0 || p.on); })
      .forEach(function (p) {
      tb.appendChild(el("tr", {}, [
        el("td", { text: p.name.trim() || "—" }),
        el("td", { text: Math.round(t.played[p.id] / 60) + "′" }),
        el("td", { text: Math.round(t.gk[p.id] / 60) + "′" }),
        el("td", { text: Math.round(tEnd.played[p.id] / 60) + "′" })
      ]));
    });
    det.textContent = ""; det.appendChild(tb);
  }
}

/* ============================================ moving players by hand
   The plan picks a sensible four, but the coach is the one watching the
   game: somebody is cold, somebody has been asking all morning to go in
   goal, somebody should not be up front today. So every shirt on the pitch
   and every name on the bench can be picked up and dropped on another one.

   Pitch onto pitch swaps their places, and since the keeper is whoever
   stands in slot nought, dropping a player on the goalkeeper's shirt is how
   you change who is in goal. Pitch onto bench makes the substitution there
   and then. Either way the shifts still to come are worked out again from
   the clock, so a change by hand costs nobody their minutes - it just moves
   them around.

   This is done with pointer events rather than HTML drag and drop, which
   does not exist on an iPhone. */
var DRAGGING = false;

function draggable(node, pid) {
  node.addEventListener("pointerdown", function (e) {
    if (!M || M.done) return;
    if (e.button != null && e.button !== 0) return;
    var sx = e.clientX, sy = e.clientY, moved = false, ghost = null, over = null;

    function paintOver(next) {
      if (over === next) return;
      if (over) over.classList.remove("drop");
      over = next;
      if (over) over.classList.add("drop");
    }
    function nearest(x, y) {
      var best = null, bestD = Infinity;
      Array.prototype.slice.call(document.querySelectorAll("#live [data-pid]"))
        .forEach(function (n) {
          if (+n.dataset.pid === pid) return;
          var r = n.getBoundingClientRect();
          if (!r.width) return;
          var inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
          var d = inside ? 0 : Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
          if (d < bestD) { bestD = d; best = n; }
        });
      return bestD <= 140 ? best : null;
    }
    function move(ev) {
      if (!moved) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        moved = true; DRAGGING = true;
        node.classList.add("drag");
        var keeper = M.segs[M.curSeg] && M.segs[M.curSeg].on[0] === pid;
        ghost = el("div", { class: "shirt ghostly" + (keeper ? " k" : "") }, [
          el("div", { class: "d", text: keeper ? "GK" : ((nameOf(pid).trim()[0] || "?").toUpperCase()) }),
          el("div", { class: "n", text: nameOf(pid) })
        ]);
        document.body.appendChild(ghost);
      }
      ev.preventDefault();
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
      paintOver(nearest(ev.clientX, ev.clientY));
    }
    function up(ev) {
      node.removeEventListener("pointermove", move);
      node.removeEventListener("pointerup", up);
      node.removeEventListener("pointercancel", up);
      if (!moved) return;
      DRAGGING = false;
      node.classList.remove("drag");
      if (ghost) ghost.remove();
      var target = over;
      paintOver(null);
      if (target && ev.type !== "pointercancel") {
        save("dragged", true);
        swapPlayers(pid, +target.dataset.pid);
      } else { M.sig = ""; paintLive(); }
    }
    try { node.setPointerCapture(e.pointerId); } catch (err) {}
    node.addEventListener("pointermove", move);
    node.addEventListener("pointerup", up);
    node.addEventListener("pointercancel", up);
  });
}

function swapPlayers(aId, bId) {
  var seg = M.segs[M.curSeg];
  if (!seg) return;
  var on = seg.on.slice(), ai = on.indexOf(aId), bi = on.indexOf(bId);
  if (ai < 0 && bi < 0) return;                 /* two on the bench: nothing */
  if (ai >= 0 && bi >= 0) { on[ai] = bId; on[bi] = aId; }
  else if (ai >= 0) on[ai] = bId;
  else on[bi] = aId;
  applyLineup(on);
  beep(1, 760);
}

/* Put this exact four on the pitch from now, and work out the shifts that
   follow with the minutes already served carried over. */
function applyLineup(on) {
  var t = Math.min(elapsed(), totalSec());
  var hs = halfSec(), h0 = Math.min(cfg.halves - 1, Math.floor(t / hs + 1e-9));

  /* run the hand-picked four to the next shift change that is not already
     on top of us, so a swap made seconds before the buzzer is not undone */
  var segEnd = null;
  for (var i = 0; i < M.segs.length; i++) {
    if (M.segs[i].end > t + 1) { segEnd = M.segs[i].end; break; }
  }
  if (segEnd == null) segEnd = totalSec();
  segEnd = Math.min(segEnd, (h0 + 1) * hs);
  if (segEnd <= t + 0.5) return;

  var kept = [];
  M.segs.forEach(function (sg) {
    if (sg.end <= t + 0.001) kept.push(sg);
    else if (sg.start < t - 0.001)
      kept.push({ half: sg.half, start: sg.start, end: t, on: sg.on, gk: sg.gk, off: sg.off });
  });

  var pl = available(), onSet = {};
  on.forEach(function (id) { onSet[id] = 1; });
  kept.push({ half: h0, start: t, end: segEnd, on: on.slice(), gk: on[0],
              off: pl.filter(function (q) { return !onSet[q.id]; })
                     .map(function (q) { return q.id; }) });

  var ids = squad.map(function (q) { return q.id; });
  var seed = tally(kept, segEnd, ids);
  seed.lastGk = on[0]; seed.onNow = on.slice();
  var remain = M.segs.filter(function (sg) {
    return sg.half === h0 && sg.end > segEnd + 0.001; }).length;
  var fresh = buildPlan(pl, cfg, planWindows(cfg, segEnd, remain), seed, kept.length);

  M.segs = kept.concat(fresh);
  M.curSeg = segAt(t);
  M.alert = null; M.sig = "";
  saveMatch(); paintLive();
}

/* who is actually here, changed mid-game */
function openSquadSheet() {
  var host = $("#sheet"); host.textContent = "";
  var rows = el("div", { class: "roster" });
  squad.filter(function (p) { return p.name.trim(); }).forEach(function (p) {
    var row = el("div", { class: "pl" + (p.on ? "" : " out") }, [
      el("span", { style: "flex:1;font-weight:600", text: p.name.trim() || "—" }),
      el("button", { class: "tog", text: "HERE", "aria-pressed": String(!!p.on), onclick: function () {
        p.on = !p.on; saveSquad(); closeSheet(); openSquadSheet();
      } }),
      el("button", { class: "tog gk", text: "GK", "aria-pressed": String(!!p.gk), onclick: function () {
        p.gk = !p.gk; saveSquad(); closeSheet(); openSquadSheet();
      } })
    ]);
    rows.appendChild(row);
  });
  var inner = el("div", { class: "inner" }, [
    el("div", { class: "grab" }, [el("i", {})]),
    el("h2", { text: "Who's here" }),
    el("p", { class: "note", html: "Turn someone off if they are hurt or have gone home, on if they have just arrived. The rest of the game is worked out again from the clock, and the minutes already played are kept." }),
    rows,
    el("div", { class: "foot" }, [
      el("button", { class: "btn pri wide", text: "Re-plan the rest of the game", onclick: function () {
        closeSheet();
        if (M && !M.done) { replanFrom(elapsed(), true); M.sig = ""; saveMatch(); paintLive(); }
        else refreshPlan();
      } })
    ])
  ]);
  var sh = el("div", { class: "sheet", onclick: function (e) { if (e.target === sh) closeSheet(); } }, [inner]);
  host.appendChild(sh);
}

/* ================================================================ start */
function showTab(which) {
  var w = which === "warm";
  $("#tabWarm").setAttribute("aria-selected", String(w));
  $("#tabMatch").setAttribute("aria-selected", String(!w));
  $("#paneWarm").classList.toggle("hide", !w);
  $("#paneMatch").classList.toggle("hide", w);
  save("tab", which);
  window.scrollTo(0, 0);
}
$("#tabWarm").addEventListener("click", function () { tidySquad(); showTab("warm"); });
$("#tabMatch").addEventListener("click", function () { tidySquad(); renderMatch(); showTab("match"); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeSheet(); }
});

tidySquad();
renderWarm();
renderMatch();
showTab(load("tab", "warm"));
</script>
</body></html>
